[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femtools"
version = "0.1.0"
description = "Solver-independent CAE framework for structural dynamics, correlation, model updating and optimization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "femtools contributors"}]
keywords = [
  "structural-dynamics",
  "modal-analysis",
  "finite-elements",
  "model-updating",
  "correlation",
  "pretest",
  "optimization",
  "experimental-modal-analysis",
  "operational-modal-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/9997433-bit/femtools"
Repository = "https://github.com/9997433-bit/femtools"
Issues = "https://github.com/9997433-bit/femtools/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.8",
]
viz = [
  "plotly>=5.20",
  "pyvista>=0.43",
]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
femtools = "femtools.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "golden: analytical golden-case tests",
  "slow: long-running tests",
  "perf: performance benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options via function-call defaults (B008 false positive)
"src/femtools/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["femtools"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["femtools"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
