name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Import smoke test
        run: python -c "import femtools; print('femtools', femtools.__version__)"

      - name: Pytest
        # Round 1 lands packages and tests from parallel branches; keep CI green
        # when the tests/ tree is absent or collects nothing (pytest exit code 5).
        # Tests for not-yet-merged modules must skip via importorskip.
        run: |
          if [ ! -d tests ]; then
            echo "No tests/ directory on this branch yet - skipping pytest."
            exit 0
          fi
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "pytest collected no tests - treating as success."
            exit 0
          fi
          exit "$code"
