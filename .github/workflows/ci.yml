name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Import smoke test
        run: python -c "import femtools; print('femtools', femtools.__version__)"

      - name: Public API smoke test
        run: |
          python - <<'EOF'
          import femtools

          missing = [name for name in femtools.__all__ if getattr(femtools, name, None) is None]
          assert not missing, f"unresolvable exports: {missing}"
          print(f"femtools {femtools.__version__}: {len(femtools.__all__)} exports resolve")
          EOF

      - name: Pytest
        # Strict since Round 2: an empty collection (exit 5) is a failure.
        run: pytest -q

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: mypy src/femtools
